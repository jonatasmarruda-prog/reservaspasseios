name: Boas-vindas após pagamento

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'automation/send-paid-welcome-emails.mjs'
      - 'public/admin-reservation-sync-v35.js'
      - 'public/admin-email-controls.js'
      - '.github/workflows/paid-welcome-email.yml'

permissions:
  contents: read

concurrency:
  group: trilheiros-paid-welcome-email
  cancel-in-progress: false

jobs:
  send-welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install --prefix automation --no-audit --no-fund
      - name: Enviar boas-vindas para reservas quitadas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: 'Trilheiros de Rondonópolis <reservas@trilheirosderondonopolis.com.br>'
        run: node automation/send-paid-welcome-emails.mjs
