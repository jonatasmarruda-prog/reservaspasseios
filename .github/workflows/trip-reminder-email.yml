name: Lembrete um dia antes do passeio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/send-trip-reminders.mjs'
      - '.github/workflows/trip-reminder-email.yml'
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  group: trilheiros-trip-reminder-email
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install --prefix automation --no-audit --no-fund
      - name: Enviar lembretes de passeio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node automation/send-trip-reminders.mjs
