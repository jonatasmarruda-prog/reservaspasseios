name: Publicar notificações e e-mail imediato

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/push-notifications.js'
      - 'functions/entry.js'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/push-functions-deploy.yml'

permissions:
  contents: read

concurrency:
  group: trilheiros-push-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências das Functions
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validar Functions de notificações
        working-directory: functions
        run: node --check push-notifications.js

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar somente notificações e confirmação imediata
        run: firebase deploy --project trilheiros-reservas --only functions:registerPushDevice,functions:notifyNewReservation,functions:notifyReservationUpdate,functions:notifyPaymentUpdate --non-interactive
