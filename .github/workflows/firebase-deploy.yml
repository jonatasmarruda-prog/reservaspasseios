name: Publicar Trilheiros no Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trilheiros-firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar JavaScript público
        run: |
          set -e
          find public -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['public/cadastro.html','public/politica.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
            for(const s of scripts)new Function(s);
            console.log(file,'inline scripts ok:',scripts.length);
          }
          NODE

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar Hosting
        run: firebase deploy --project trilheiros-reservas --only hosting --non-interactive
