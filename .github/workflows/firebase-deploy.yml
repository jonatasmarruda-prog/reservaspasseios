name: Publicar Trilheiros no Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trilheiros-firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências das Functions
        run: npm install --prefix functions --no-audit --no-fund

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar Hosting
        run: firebase deploy --project trilheiros-reservas --only hosting --non-interactive

      - name: Publicar Functions
        continue-on-error: true
        run: firebase deploy --project trilheiros-reservas --only functions --non-interactive
