name: Publicar Trilheiros no Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trilheiros-firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar JavaScript público
        run: |
          node --check public/reservation-portal-v27.js
          node --check public/participant-unification-v44.js
          node --check public/admin-costs-v36.js
          node --check public/admin-stable-v42.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('public/cadastro.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
          for(const [i,s] of scripts.entries())new Function(s);
          console.log('cadastro.html inline scripts ok:',scripts.length);
          NODE

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar Hosting
        run: firebase deploy --project trilheiros-reservas --only hosting --non-interactive
