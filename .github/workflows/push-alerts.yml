name: Push em segundo plano

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/send-push-alerts.mjs'
      - '.github/workflows/push-alerts.yml'

permissions:
  contents: read

concurrency:
  group: trilheiros-push-background
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --prefix automation --no-audit --no-fund
      - name: Enviar alertas FCM
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node automation/send-push-alerts.mjs
