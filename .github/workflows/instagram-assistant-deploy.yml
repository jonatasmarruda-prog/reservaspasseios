name: Publicar Assistente Instagram

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trilheiros-instagram-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências das Functions
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Testar motor do assistente
        working-directory: functions
        run: npm test

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar webhook, painel e rotas
        run: firebase deploy --project trilheiros-reservas --only functions:instagramWebhook,functions:instagramAdminApi,hosting --non-interactive

