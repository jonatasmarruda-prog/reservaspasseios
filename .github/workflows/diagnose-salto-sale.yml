name: Diagnóstico temporário Salto das Nuvens

on:
  push:
    branches: [main]
    paths:
      - 'automation/diagnose-salto-sale.mjs'
      - '.github/workflows/diagnose-salto-sale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install --prefix automation --no-audit --no-fund
      - name: Consultar status técnico
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node automation/diagnose-salto-sale.mjs
