<title>Cadastro do passeio | Trilheiros de Rondonópolis</title>

<style>
:root{--green:#073226;--green2:#0b6046;--gold:#d7ad43;--ink:#17372d;--muted:#687d74;--line:#dce8e3;--bg:#eef5f1;--danger:#a33a31}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5f1,#f8fbf9);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button,input,select{font:inherit}.top{background:var(--green);color:#fff;padding:18px 20px}.brand{max-width:920px;margin:auto;display:flex;align-items:center;gap:13px}.brand img{width:72px;height:72px;object-fit:contain}.brand strong{display:block;font-size:17px;letter-spacing:.04em}.brand span{display:block;margin-top:3px;font-size:12px;color:#c5d9d1}.wrap{max-width:920px;margin:24px auto;padding:0 14px 35px}.hero,.card,.success{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px rgba(7,50,38,.07)}.hero{padding:22px;margin-bottom:16px;background:linear-gradient(135deg,#073226,#0a5942);color:#fff}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#dfbd61}.hero h1{margin:7px 0;font-size:30px;line-height:1.15}.hero p{margin:0;color:#d2e2dc;line-height:1.55}.card{padding:22px}.trip{padding:20px;border-radius:18px;background:#f2f8f5;border:1px solid #d9e9e2;margin-bottom:20px}.trip small,.field span{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:6px}.trip b{display:block;font-size:24px;line-height:1.2;color:var(--green)}.tripmeta{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-top:15px}.tripmeta>div{padding:11px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}.tripmeta strong{font-size:15px;color:var(--green)}.tripmeta .spots strong{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:block}.field input,.field select{width:100%;min-height:48px;border:1px solid #cbded5;border-radius:13px;background:#fbfdfc;padding:0 13px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#4c9a7f;box-shadow:0 0 0 3px rgba(76,154,127,.12)}.full{grid-column:1/-1}.section{margin:23px 0 10px}.section h2{margin:0 0 4px;font-size:18px}.section p{margin:0;color:var(--muted);font-size:12px}.participant{padding:15px;border:1px solid var(--line);border-radius:17px;margin-top:10px;background:#fbfdfc}.participant b{display:block;margin-bottom:11px;color:var(--green)}.policy{white-space:pre-wrap;background:#fffaf0;border:1px solid #ead9a7;border-radius:16px;padding:16px;font-size:13px;line-height:1.55;max-height:260px;overflow:auto}.check{display:flex;gap:10px;align-items:flex-start;margin:15px 0;font-size:13px;line-height:1.45}.check input{margin-top:3px}.profileHint{margin-top:6px;font-size:11px;line-height:1.45;color:#2e7d5b}.btn{width:100%;min-height:51px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{margin:13px 0;padding:12px 14px;border-radius:13px;font-size:13px}.msg.error{background:#fff0ee;color:#912f27;border:1px solid #f0c3bd}.loading{text-align:center;padding:42px 15px;color:var(--muted)}.success{padding:34px;text-align:center}.success .icon{font-size:45px}.success h1{color:var(--green);margin:8px 0}.success p{color:var(--muted);line-height:1.6}.success .ticket{margin:18px auto;padding:14px;background:#f2f8f5;border-radius:14px;max-width:520px}.footer{text-align:center;color:#75867f;font-size:11px;padding:20px}@media(max-width:680px){.top{padding:12px 14px}.brand img{width:60px;height:60px}.wrap{margin-top:15px}.hero,.card{border-radius:19px}.hero h1{font-size:25px}.grid,.tripmeta{grid-template-columns:1fr}.full{grid-column:auto}.trip b{font-size:22px}}
</style>
<script src="/__/firebase/10.14.1/firebase-app-compat.js" defer></script>
<script src="/__/firebase/10.14.1/firebase-auth-compat.js" defer></script>
<script src="/__/firebase/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="/__/firebase/init.js" defer></script>
<script src="/participant-unification-v44.js?v=20261001-unified1" defer></script>
</head>
<body>
<div class="top"><div class="brand"><img src="https://trilheiros-reservas.web.app/assets/trilheiros-logo-email.png?v=20260925-hosted1" alt="Trilheiros de Rondonópolis"><div><strong>TRILHEIROS</strong><span>de Rondonópolis</span></div></div></div>
<main class="wrap" id="app"><section class="card"><div class="loading">Carregando cadastro do passeio...</div></section></main>
<div class="footer">Trilheiros de Rondonópolis • Aqui ninguém vai só.</div>
<script>
window.addEventListener('DOMContentLoaded',async()=>{
 const app=document.getElementById('app');
 const tripId=decodeURIComponent((location.pathname.match(/^\/cadastro\/([^/?#]+)/)||[])[1]||'');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
 const digits=v=>String(v||'').replace(/\D/g,'').slice(0,11);
 const cpfMask=v=>digits(v).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
 const validCpf=v=>{const n=digits(v);if(n.length!==11||/^(\d)\1{10}$/.test(n))return false;let s=0;for(let i=0;i<9;i++)s+=Number(n[i])*(10-i);let d=(s*10)%11;if(d===10)d=0;if(d!==Number(n[9]))return false;s=0;for(let i=0;i<10;i++)s+=Number(n[i])*(11-i);d=(s*10)%11;if(d===10)d=0;return d===Number(n[10])};
 const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim().toLowerCase());
 const dateBR=v=>{const s=String(v||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
 const fail=message=>app.innerHTML=`<section class="card"><div class="loading"><b style="color:#8f3028">Cadastro indisponível</b><br><br>${esc(message)}</div></section>`;
 try{
  if(!tripId)throw Error('Link do passeio inválido.');
  if(!window.firebase?.apps?.length)throw Error('Não foi possível conectar ao sistema. Atualize a página e tente novamente.');
  if(!window.TrilheirosParticipant)throw Error('Cadastro único temporariamente indisponível. Atualize a página.');
  const db=firebase.firestore(),auth=firebase.auth();auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});if(!auth.currentUser)await auth.signInAnonymously();
  const tripRef=db.collection('trips').doc(tripId),tripSnap=await tripRef.get();if(!tripSnap.exists)throw Error('Passeio não encontrado. Solicite um novo link ao Jonatas.');
  const trip={id:tripSnap.id,...tripSnap.data()},remaining=Math.max(0,Number(trip.remaining_spots||0));if(trip.status!=='open')throw Error('O cadastro deste passeio está encerrado.');
  app.innerHTML=`<section class="hero"><span class="eyebrow">CADASTRO DO PASSEIO</span><h1>${esc(trip.name||'Passeio')}</h1><p>Preencha seus dados. Se você já participou de outro passeio, o sistema pode reaproveitar seu cadastro pelo CPF.</p></section><section class="card"><div class="trip"><small>PASSEIO</small><b>${esc(trip.name||'Passeio')}</b><div class="tripmeta"><div><small>DATA</small><strong>📅 ${dateBR(trip.trip_date)}</strong></div><div><small>LOCAL</small><strong>📍 ${esc(trip.destination||trip.location||'A confirmar')}</strong></div><div class="spots"><small>VAGAS</small><strong>${remaining}</strong></div></div></div><form id="reg"><div class="grid"><label class="field"><span>CPF</span><input name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></label><label class="field"><span>NOME COMPLETO</span><input name="name" autocomplete="name" required></label><label class="field"><span>E-MAIL</span><input name="email" type="email" autocomplete="email" required></label><label class="field"><span>QUANTIDADE NESTE CADASTRO</span><select name="seats" required></select></label></div><div class="profileHint" id="mainProfileHint"></div><div id="extra"></div><div class="section"><h2>Política de cancelamento</h2><p>Leia antes de concluir o cadastro.</p></div><div class="policy">${esc(trip.cancellation_policy||'Política não informada. Entre em contato com a organização.')}</div><label class="check"><input name="accepted" type="checkbox" required><span>Li e estou de acordo com a política de cancelamento e com as orientações do passeio.</span></label><div id="msg"></div><button class="btn" id="submit">Confirmar cadastro e enviar para o passeio</button></form></section>`;
  const form=document.getElementById('reg'),extra=document.getElementById('extra'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),hint=document.getElementById('mainProfileHint');const max=Math.min(10,Math.max(1,remaining));form.seats.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1} ${i?'pessoas':'pessoa'}</option>`).join('');
  async function lookup(cpfEl,nameEl,emailEl,hintEl,withEmail=false){
    try{
      const c=digits(cpfEl.value);if(c.length!==11||!validCpf(c))return;
      const found=await window.TrilheirosParticipant.lookupProfile(auth,c,withEmail?emailEl.value:'');
      if(found?.verified&&found.profile){
        if(!nameEl.value)nameEl.value=found.profile.full_name||'';
        if(!emailEl.value)emailEl.value=found.profile.email||'';
        if(hintEl)hintEl.textContent='✓ Cadastro anterior encontrado. Dados preenchidos automaticamente.';
      }else if(found?.verification_required&&hintEl)hintEl.textContent=`Cadastro encontrado. Confirme o e-mail ${found.email_hint||'já cadastrado'} para preencher automaticamente.`;
    }catch(e){console.warn('Autopreenchimento',e)}
  }
  function bindMain(){
    form.cpf.addEventListener('input',()=>form.cpf.value=cpfMask(form.cpf.value));
    form.cpf.addEventListener('blur',()=>lookup(form.cpf,form.name,form.email,hint,false));
    form.email.addEventListener('blur',()=>lookup(form.cpf,form.name,form.email,hint,true));
  }
  function renderExtra(){
    const qty=Number(form.seats.value||1);
    const old=[...extra.querySelectorAll('.participant')].map(row=>({cpf:row.querySelector('[data-extra-cpf]')?.value||'',name:row.querySelector('[data-extra-name]')?.value||'',email:row.querySelector('[data-extra-email]')?.value||''}));
    extra.innerHTML=qty>1?`<div class="section"><h2>Outros participantes</h2><p>Informe CPF, nome e e-mail de quem vai junto. Cada e-mail receberá as comunicações do passeio.</p></div>${Array.from({length:qty-1},(_,i)=>`<div class="participant"><b>Participante ${i+2}</b><div class="grid"><label class="field"><span>CPF</span><input data-extra-cpf="${i}" inputmode="numeric" maxlength="14" value="${esc(old[i]?.cpf||'')}" required></label><label class="field"><span>NOME COMPLETO</span><input data-extra-name="${i}" value="${esc(old[i]?.name||'')}" required></label><label class="field full"><span>E-MAIL</span><input data-extra-email="${i}" type="email" value="${esc(old[i]?.email||'')}" required></label></div><div class="profileHint" data-extra-hint="${i}"></div></div>`).join('')}`:'';
    [...extra.querySelectorAll('[data-extra-cpf]')].forEach(el=>{
      el.addEventListener('input',()=>el.value=cpfMask(el.value));
      el.addEventListener('blur',()=>{const i=Number(el.dataset.extraCpf),nameEl=extra.querySelector(`[data-extra-name="${i}"]`),emailEl=extra.querySelector(`[data-extra-email="${i}"]`),h=extra.querySelector(`[data-extra-hint="${i}"]`);lookup(el,nameEl,emailEl,h,false)});
    });
    [...extra.querySelectorAll('[data-extra-email]')].forEach(el=>el.addEventListener('blur',()=>{const i=Number(el.dataset.extraEmail),cpfEl=extra.querySelector(`[data-extra-cpf="${i}"]`),nameEl=extra.querySelector(`[data-extra-name="${i}"]`),h=extra.querySelector(`[data-extra-hint="${i}"]`);lookup(cpfEl,nameEl,el,h,true)}));
  }
  bindMain();form.seats.addEventListener('change',renderExtra);renderExtra();
  async function fallbackRegister(participants){
    let user=auth.currentUser||await auth.signInAnonymously().then(x=>x.user),uid=user.uid,saleRef=db.collection('sales').doc(uid),saleSnap=await saleRef.get();const stamp=firebase.firestore.FieldValue.serverTimestamp();
    if(saleSnap.exists&&saleSnap.data()?.trip_id!==tripId){await auth.signOut();user=(await auth.signInAnonymously()).user;uid=user.uid;saleRef=db.collection('sales').doc(uid);saleSnap=await saleRef.get()}
    if(saleSnap.exists){
      const sale=saleSnap.data()||{};
      if(sale.trip_id===tripId&&sale.sale_status!=='cancelled'){
        const resRef=tripRef.collection('reservations').doc(uid),resSnap=await resRef.get();
        if(resSnap.exists){
          const rd=resSnap.data()||{},map=new Map();
          [...(Array.isArray(rd.participants)?rd.participants:[]),...participants].forEach(p=>{const key=digits(p?.cpf);if(key)map.set(key,{...(map.get(key)||{}),full_name:p.full_name||p.name||'',cpf:key,email:String(p.email||'').trim().toLowerCase()})});
          const merged=[...map.values()],first=participants[0],salePatch={customer_name:first.full_name,customer_cpf:first.cpf,customer_email:first.email,participants:merged,registration_status:'completed',registered_at:stamp,updated_at:stamp};
          const resPatch={responsible_name:first.full_name,responsible_cpf:first.cpf,email:first.email,participants:merged,registration_answers:{origem:{label:'Origem',value:'Link do passeio'}},status:'active',registration_status:'completed',policy_text:trip.cancellation_policy||rd.policy_text||'',policy_version:'direct-trip-link-2026-10',policy_accepted:true,policy_accepted_at:stamp,updated_at:stamp};
          await Promise.all([saleRef.update(salePatch),resRef.update(resPatch)]);
          window.TrilheirosParticipant?.rememberLocal?.(participants);
          return{ok:true,merged:true,protocol:sale.protocol||rd.protocol||'—',trip_id:tripId,sale_id:uid,reservation_id:uid,seats:Number(sale.seats||rd.seats||merged.length)};
        }
      }
    }
    const resRef=tripRef.collection('reservations').doc(uid),existing=await resRef.get();
    if(existing.exists){
      const rd=existing.data()||{};window.TrilheirosParticipant?.rememberLocal?.(participants);
      return{ok:true,merged:true,protocol:rd.protocol||'—',trip_id:tripId,reservation_id:uid,seats:Number(rd.seats||participants.length)};
    }
    const seats=participants.length,code=`TL-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
    await db.runTransaction(async tx=>{
      const ts=await tx.get(tripRef),rs=await tx.get(resRef);if(!ts.exists)throw Error('Passeio não encontrado.');if(rs.exists)return;
      const t=ts.data()||{},rem=Math.max(0,Number(t.remaining_spots||0)),used=Math.max(0,Number(t.used_spots||0));if(t.status!=='open')throw Error('O cadastro deste passeio está encerrado.');if(rem<seats)throw Error(rem<=0?'O passeio está lotado. Se você já pagou pelo Canva, abra este link no mesmo aparelho usado na reserva ou fale com o Jonatas.':`Restam somente ${rem} vaga(s).`);
      const first=participants[0],total=Math.max(0,Number(t.default_price||0)*seats);
      tx.set(resRef,{trip_id:tripId,trip_name:t.name||trip.name||'',trip_date:t.trip_date||trip.trip_date||'',protocol:code,sale_id:uid,name:first.full_name,responsible_name:first.full_name,responsible_cpf:first.cpf,email:first.email,seats,participants,registration_status:'completed',registration_source:'direct_trip_link',registration_completed_at:stamp,registration_email_status:'pending',registration_email_requested_at:stamp,status:'active',sale_total:total,paid_amount:0,balance_due:total,refunded_amount:0,payment_status:'pending',payment_method:'a_confirmar',payment_origin:'a_confirmar',policy_text:t.cancellation_policy||'',policy_version:'direct-trip-link-2026-10',policy_accepted:true,policy_accepted_at:stamp,source:'direct_trip_link',created_at:stamp,updated_at:stamp});
      tx.set(saleRef,{trip_id:tripId,trip_name:t.name||trip.name||'',trip_date:t.trip_date||trip.trip_date||'',customer_name:first.full_name,customer_cpf:first.cpf,customer_email:first.email,seats,sale_total:total,paid_amount:0,balance_due:total,refunded_amount:0,payment_method:'a_confirmar',payment_status:'pending',installment_total:1,next_due_date:'',payment_history:[],received_date:'',registration_status:'completed',sale_status:'active',claimed_uid:uid,protocol:code,participants,notes:'Cadastro pelo link do passeio. Valor estimado pelo preço padrão até conferência.',source:'public_portal_v27',channel:'direct_trip_link',created_at:stamp,updated_at:stamp});
      tx.update(tripRef,{used_spots:used+seats,remaining_spots:rem-seats,updated_at:stamp});
    });
    window.TrilheirosParticipant?.rememberLocal?.(participants);
    return{ok:true,created:true,merged:false,protocol:code,trip_id:tripId,reservation_id:uid,seats};
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();msg.innerHTML='';btn.disabled=true;btn.textContent='Enviando cadastro...';
    try{
      const name=form.name.value.trim(),cpf=digits(form.cpf.value),email=form.email.value.trim().toLowerCase(),seats=Number(form.seats.value||1);
      if(name.length<3)throw Error('Informe o nome completo.');if(!validCpf(cpf))throw Error('Informe um CPF válido.');if(!validEmail(email))throw Error('Informe um e-mail válido.');
      const participants=[{full_name:name,cpf,email}];
      for(let i=0;i<seats-1;i++){
        const pCpf=digits(extra.querySelector(`[data-extra-cpf="${i}"]`)?.value||''),pName=extra.querySelector(`[data-extra-name="${i}"]`)?.value.trim()||'',pEmail=extra.querySelector(`[data-extra-email="${i}"]`)?.value.trim().toLowerCase()||'';
        if(!validCpf(pCpf))throw Error(`CPF inválido no participante ${i+2}.`);if(pName.length<3)throw Error(`Informe o nome do participante ${i+2}.`);if(!validEmail(pEmail))throw Error(`Informe o e-mail do participante ${i+2}.`);
        participants.push({full_name:pName,cpf:pCpf,email:pEmail});
      }
      if(new Set(participants.map(p=>p.cpf)).size!==participants.length)throw Error('Há CPF repetido entre os participantes.');
      let result;try{result=await window.TrilheirosParticipant.register(auth,{trip_id:tripId,trip_name:trip.name||'',source:'direct_trip_link',participants})}catch(apiErr){console.warn('Cadastro global indisponível; usando modo compatível.',apiErr);result=await fallbackRegister(participants)}
      app.innerHTML=`<section class="success"><div class="icon">✅</div><h1>Cadastro confirmado!</h1><p><b>${esc(name)}</b>, seus dados foram vinculados ao passeio <b>${esc(trip.name||'')}</b>.</p><div class="ticket"><b>Protocolo: ${esc(result.protocol||'—')}</b><br>${dateBR(trip.trip_date)} • ${result.seats||participants.length} participante(s)</div><p>${result.merged?'Seu cadastro anterior foi reconhecido e atualizado sem duplicar a reserva.':'Cadastro salvo. Você receberá a confirmação no e-mail informado.'}</p></section>`;
    }catch(err){msg.innerHTML=`<div class="msg error">${esc(err.message||'Não foi possível concluir o cadastro.')}</div>`;btn.disabled=false;btn.textContent='Confirmar cadastro e enviar para o passeio'}
  });
 }catch(err){fail(err.message||'Não foi possível abrir este cadastro.');}
});
</script>
