<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073226">
<title>Cadastro do passeio | Trilheiros de Rondonópolis</title>
<link rel="icon" href="/app-icon-192.svg" type="image/svg+xml">
<link rel="preconnect" href="https://i.postimg.cc">
<link rel="preload" as="image" href="https://i.postimg.cc/JnF2F9Hw/LOGO-TRILHEIROS-Photoroom.png">
<style>
:root{--green:#073226;--green2:#0b6046;--gold:#d7ad43;--ink:#17372d;--muted:#687d74;--line:#dce8e3;--bg:#eef5f1;--danger:#a33a31}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5f1,#f8fbf9);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button,input,select{font:inherit}.top{background:var(--green);color:#fff;padding:18px 20px}.brand{max-width:920px;margin:auto;display:flex;align-items:center;gap:13px}.brand img{width:72px;height:72px;object-fit:contain}.brand strong{display:block;font-size:17px;letter-spacing:.04em}.brand span{display:block;margin-top:3px;font-size:12px;color:#c5d9d1}.wrap{max-width:920px;margin:24px auto;padding:0 14px 35px}.hero,.card,.success{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px rgba(7,50,38,.07)}.hero{padding:22px;margin-bottom:16px;background:linear-gradient(135deg,#073226,#0a5942);color:#fff}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#dfbd61}.hero h1{margin:7px 0;font-size:27px}.hero p{margin:0;color:#d2e2dc;line-height:1.55}.card{padding:22px}.trip{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:16px;border-radius:18px;background:#f2f8f5;border:1px solid #d9e9e2;margin-bottom:20px}.trip small,.field span{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:6px}.trip b{font-size:19px;color:var(--green)}.trip .spots{text-align:center;min-width:90px}.trip .spots strong{display:block;font-size:27px;color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:block}.field input,.field select{width:100%;min-height:48px;border:1px solid #cbded5;border-radius:13px;background:#fbfdfc;padding:0 13px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#4c9a7f;box-shadow:0 0 0 3px rgba(76,154,127,.12)}.full{grid-column:1/-1}.section{margin:23px 0 10px}.section h2{margin:0 0 4px;font-size:18px}.section p{margin:0;color:var(--muted);font-size:12px}.participant{padding:15px;border:1px solid var(--line);border-radius:17px;margin-top:10px;background:#fbfdfc}.participant b{display:block;margin-bottom:11px;color:var(--green)}.policy{white-space:pre-wrap;background:#fffaf0;border:1px solid #ead9a7;border-radius:16px;padding:16px;font-size:13px;line-height:1.55;max-height:260px;overflow:auto}.check{display:flex;gap:10px;align-items:flex-start;margin:15px 0;font-size:13px;line-height:1.45}.check input{margin-top:3px}.btn{width:100%;min-height:51px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{margin:13px 0;padding:12px 14px;border-radius:13px;font-size:13px}.msg.error{background:#fff0ee;color:#912f27;border:1px solid #f0c3bd}.msg.ok{background:#e9f7ef;color:#1a6647;border:1px solid #bfe1ce}.loading{text-align:center;padding:42px 15px;color:var(--muted)}.success{padding:34px;text-align:center}.success .icon{font-size:45px}.success h1{color:var(--green);margin:8px 0}.success p{color:var(--muted);line-height:1.6}.success .ticket{margin:18px auto;padding:14px;background:#f2f8f5;border-radius:14px;max-width:520px}.footer{text-align:center;color:#75867f;font-size:11px;padding:20px}@media(max-width:680px){.top{padding:12px 14px}.brand img{width:60px;height:60px}.wrap{margin-top:15px}.hero,.card{border-radius:19px}.hero h1{font-size:23px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.trip{grid-template-columns:1fr}.trip .spots{text-align:left}.trip .spots strong{display:inline;margin-right:6px;font-size:20px}}
</style>
<script src="/__/firebase/10.14.1/firebase-app-compat.js" defer></script>
<script src="/__/firebase/10.14.1/firebase-auth-compat.js" defer></script>
<script src="/__/firebase/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="/__/firebase/init.js" defer></script>
</head>
<body>
<div class="top"><div class="brand"><img src="https://i.postimg.cc/JnF2F9Hw/LOGO-TRILHEIROS-Photoroom.png" alt="Trilheiros de Rondonópolis"><div><strong>TRILHEIROS</strong><span>de Rondonópolis</span></div></div></div>
<main class="wrap" id="app"><section class="card"><div class="loading">Carregando cadastro do passeio...</div></section></main>
<div class="footer">Trilheiros de Rondonópolis • Aqui ninguém vai só.</div>
<script>
window.addEventListener('DOMContentLoaded',async()=>{
  const app=document.getElementById('app');
  const tripId=decodeURIComponent((location.pathname.match(/^\/cadastro\/([^/?#]+)/)||[])[1]||'');
  const logo='https://i.postimg.cc/JnF2F9Hw/LOGO-TRILHEIROS-Photoroom.png';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const digits=v=>String(v||'').replace(/\D/g,'').slice(0,11);
  const maskCpf=v=>digits(v).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  const dateBR=v=>{const s=String(v||'').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
  const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
  const fail=message=>app.innerHTML=`<section class="card"><div class="loading"><b style="color:#8f3028">Cadastro indisponível</b><br><br>${esc(message)}</div></section>`;
  try{
    if(!tripId)throw Error('Link do passeio inválido.');
    if(!window.firebase?.apps?.length)throw Error('Não foi possível conectar ao sistema. Atualize a página e tente novamente.');
    const db=firebase.firestore(),auth=firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    if(!auth.currentUser)await auth.signInAnonymously();
    const tripRef=db.collection('trips').doc(tripId),tripSnap=await tripRef.get();
    if(!tripSnap.exists)throw Error('Passeio não encontrado. Solicite um novo link ao Jonatas.');
    const trip={id:tripSnap.id,...tripSnap.data()},remaining=Math.max(0,Number(trip.remaining_spots||0));
    if(trip.status!=='open')throw Error('O cadastro deste passeio está encerrado.');
    if(remaining<1)throw Error('As vagas disponíveis para este link foram encerradas.');
    app.innerHTML=`<section class="hero"><span class="eyebrow">CADASTRO DO PARTICIPANTE</span><h1>Preencha seus dados para o passeio.</h1><p>Este cadastro será enviado diretamente para a lista de participantes do passeio escolhido.</p></section><section class="card"><div class="trip"><div><small>PASSEIO</small><b>${esc(trip.name||'Passeio')}</b><div style="margin-top:5px;color:#60756c;font-size:13px">📅 ${dateBR(trip.trip_date)}${trip.destination?` • 📍 ${esc(trip.destination)}`:''}</div></div><div class="spots"><small>VAGAS</small><strong>${remaining}</strong></div></div><form id="reg"><div class="grid"><label class="field"><span>NOME COMPLETO DO RESPONSÁVEL</span><input name="name" autocomplete="name" required></label><label class="field"><span>CPF DO RESPONSÁVEL</span><input name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" required></label><label class="field"><span>E-MAIL</span><input name="email" type="email" autocomplete="email" required></label><label class="field"><span>QUANTIDADE DE PARTICIPANTES</span><select name="seats" required></select></label></div><div class="section"><h2>Participantes</h2><p>Informe o nome e CPF de cada pessoa que irá ao passeio.</p></div><div id="participants"></div><div class="section"><h2>Política de cancelamento</h2><p>Leia antes de concluir o cadastro.</p></div><div class="policy">${esc(trip.cancellation_policy||'Política não informada. Entre em contato com a organização.')}</div><label class="check"><input name="accepted" type="checkbox" required><span>Li e estou de acordo com a política de cancelamento e com as orientações do passeio.</span></label><div id="msg"></div><button class="btn" id="submit">Confirmar cadastro e enviar para o passeio</button></form></section>`;
    const form=document.getElementById('reg'),participantsBox=document.getElementById('participants'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
    const max=Math.min(10,remaining);form.seats.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1} ${i?'pessoas':'pessoa'}</option>`).join('');
    function renderParticipants(){
      const qty=Number(form.seats.value||1),old=[...participantsBox.querySelectorAll('.participant')].map((row,i)=>({name:row.querySelector(`[data-name="${i}"]`)?.value||'',cpf:row.querySelector(`[data-cpf="${i}"]`)?.value||''}));
      participantsBox.innerHTML=Array.from({length:qty},(_,i)=>`<div class="participant"><b>Participante ${i+1}${i===0?' • responsável':''}</b><div class="grid"><label class="field"><span>NOME COMPLETO</span><input data-name="${i}" ${i===0?'readonly':''} value="${esc(i===0?form.name.value:(old[i]?.name||''))}" required></label><label class="field"><span>CPF</span><input data-cpf="${i}" inputmode="numeric" maxlength="14" ${i===0?'readonly':''} value="${esc(i===0?form.cpf.value:(old[i]?.cpf||''))}" required></label></div></div>`).join('');
      participantsBox.querySelectorAll('[data-cpf]').forEach(x=>x.addEventListener('input',()=>x.value=maskCpf(x.value)));
    }
    form.name.addEventListener('input',()=>{const x=participantsBox.querySelector('[data-name="0"]');if(x)x.value=form.name.value});
    form.cpf.addEventListener('input',()=>{form.cpf.value=maskCpf(form.cpf.value);const x=participantsBox.querySelector('[data-cpf="0"]');if(x)x.value=form.cpf.value});
    form.seats.addEventListener('change',renderParticipants);renderParticipants();
    form.addEventListener('submit',async event=>{
      event.preventDefault();msg.innerHTML='';btn.disabled=true;btn.textContent='Enviando cadastro...';
      try{
        const user=auth.currentUser||await auth.signInAnonymously().then(x=>x.user),name=form.name.value.trim(),cpf=digits(form.cpf.value),email=form.email.value.trim().toLowerCase(),seats=Number(form.seats.value||1);
        const participants=[...participantsBox.querySelectorAll('.participant')].map((row,i)=>({full_name:row.querySelector(`[data-name="${i}"]`).value.trim(),cpf:digits(row.querySelector(`[data-cpf="${i}"]`).value)}));
        if(name.length<3)throw Error('Informe o nome completo do responsável.');
        if(cpf.length!==11)throw Error('Confira o CPF do responsável.');
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Informe um e-mail válido.');
        if(participants.length!==seats||participants.some(p=>p.full_name.length<3||p.cpf.length!==11))throw Error('Confira nome e CPF de todos os participantes.');
        if(new Set(participants.map(p=>p.cpf)).size!==participants.length)throw Error('Existe CPF repetido entre os participantes.');
        const resRef=tripRef.collection('reservations').doc(user.uid),stamp=firebase.firestore.FieldValue.serverTimestamp();
        let protocol='';
        await db.runTransaction(async tx=>{
          const [freshTrip,existing]=await Promise.all([tx.get(tripRef),tx.get(resRef)]);
          if(!freshTrip.exists)throw Error('Passeio não encontrado.');
          if(existing.exists)throw Error('Este aparelho já enviou um cadastro para este passeio. Se precisar corrigir algum dado, fale com o Jonatas.');
          const t=freshTrip.data(),rem=Math.max(0,Number(t.remaining_spots||0)),used=Math.max(0,Number(t.used_spots||0));
          if(t.status!=='open')throw Error('O cadastro deste passeio está encerrado.');
          if(rem<seats)throw Error(`Restam somente ${rem} vaga(s).`);
          const total=Math.max(0,Number(t.default_price||0)*seats),paid=t.assumes_payment===false?0:total;
          protocol=`TL-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
          tx.set(resRef,{trip_id:tripId,trip_name:t.name||trip.name||'',trip_date:t.trip_date||trip.trip_date||'',protocol,name,responsible_name:name,responsible_cpf:cpf,email,seats,participants,registration_status:'completed',registration_source:'direct_trip_link',registration_completed_at:stamp,status:'active',sale_total:total,paid_amount:paid,balance_due:t.assumes_payment===false?total:0,refunded_amount:0,payment_status:t.assumes_payment===false?'pending':'paid',payment_method:'a_confirmar',payment_origin:t.assumes_payment===false?'a_confirmar':'pagamento_realizado_antes_do_cadastro',policy_text:t.cancellation_policy||'',policy_version:'direct-trip-link-2026-09',policy_accepted:true,policy_accepted_at:stamp,source:'direct_trip_link',created_at:stamp,updated_at:stamp});
          tx.update(tripRef,{used_spots:used+seats,remaining_spots:rem-seats,updated_at:stamp});
        });
        app.innerHTML=`<section class="success"><div class="icon">✅</div><span class="eyebrow">CADASTRO RECEBIDO</span><h1>Pronto, ${esc(name.split(/\s+/)[0])}!</h1><p>Seus dados foram enviados diretamente para <b>${esc(trip.name||'o passeio')}</b> e agora constam na lista de participantes.</p><div class="ticket"><b>Protocolo: ${esc(protocol)}</b><br><span style="font-size:13px;color:#647970">${seats} participante(s) • ${dateBR(trip.trip_date)}${Number(trip.default_price||0)>0?` • referência ${money(Number(trip.default_price)*seats)}`:''}</span></div><p>Qualquer dúvida ou correção de cadastro, procure o Jonatas.</p></section>`;
      }catch(err){msg.innerHTML=`<div class="msg error">${esc(err.message||'Não foi possível enviar o cadastro.')}</div>`;btn.disabled=false;btn.textContent='Confirmar cadastro e enviar para o passeio'}
    });
  }catch(err){fail(err.message||'Não foi possível abrir o cadastro.')}
});
</script>
</body>
</html>
