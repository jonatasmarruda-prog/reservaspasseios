<script>
/* No Admin, agrupa MutationObservers legados em um único callback por frame. */
if(location.pathname.startsWith('/admin')&&window.MutationObserver&&window.requestAnimationFrame){
  const NativeMutationObserver=window.MutationObserver;
  window.MutationObserver=function(callback){
    let frame=0,lastMutations=null,lastObserver=null;
    return new NativeMutationObserver((mutations,observer)=>{
      lastMutations=mutations;lastObserver=observer;
      if(frame)return;
      frame=requestAnimationFrame(()=>{frame=0;callback(lastMutations,lastObserver)});
    });
  };
  window.MutationObserver.prototype=NativeMutationObserver.prototype;
  window.__TRILHEIROS_PERF_MODE=true;
}
</script>
