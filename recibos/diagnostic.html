<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Recibos</title></head><body><pre id="out">iniciando...</pre><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
(async()=>{const o=document.getElementById('out');const rows=[];const add=(k,v)=>{rows.push(k+': '+v);o.textContent=rows.join('\n')};add('supabase_global',String(!!window.supabase));add('client',String(!!window.ReceiptsApp?.supabaseClient));try{const p=window.ReceiptsApp?.supabaseClient;if(!p)throw new Error('cliente ausente');const auth=await Promise.race([p.auth.getSession(),new Promise((_,r)=>setTimeout(()=>r(new Error('auth timeout')),8000))]);add('auth',auth.error?'erro '+auth.error.message:'ok session='+(!!auth.data?.session));const rpc=await Promise.race([p.rpc('get_public_receipt_request',{p_token:'diagnostic-invalid-token'}),new Promise((_,r)=>setTimeout(()=>r(new Error('rpc timeout')),8000))]);add('rpc',rpc.error?'erro '+rpc.error.message:'ok rows='+(Array.isArray(rpc.data)?rpc.data.length:'?'));}catch(e){add('exception',e?.message||String(e))}})();
</script></body></html>
