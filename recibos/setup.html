<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeiro acesso | Trilheiros</title><meta name="theme-color" content="#102b1c"><link rel="stylesheet" href="styles.css"></head><body><div class="login-wrap"><div class="login-card"><div class="brand"><img class="brand-logo" src="https://i.postimg.cc/09t8GNX6/LOGO-TRILHEIROS-Photoroom.png" alt="Logo Trilheiros de Rondonópolis"><div><h1 style="font-size:17px;margin:0">Trilheiros de Rondonópolis</h1><small style="color:#657168">Ativação do acesso</small></div></div><h1>Primeiro acesso</h1><p>Crie sua conta para acessar o painel de recibos. Use o código de ativação recebido.</p><form id="setupForm"><div class="field"><label>E-mail</label><input name="email" type="email" required autocomplete="email" placeholder="seu@email.com"></div><div style="height:12px"></div><div class="field"><label>Senha</label><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div><div style="height:12px"></div><div class="field"><label>Código de ativação</label><input name="code" required autocomplete="one-time-code" placeholder="Cole o código recebido"></div><div id="msg" class="notice hidden"></div><div class="actions"><button class="btn btn-primary" style="width:100%">Criar acesso</button></div></form><p style="text-align:center;margin-top:18px"><a href="admin.html">Já tenho acesso</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script src="setup.js"></script></body></html>
